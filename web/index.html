<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- No pinch or focus zoom on phones: iOS Safari zooms into a focused field
       and the Flutter canvas then stays zoomed and stuck while a form is
       filled in. Desktop browsers ignore this tag, so their zoom still works
       (viewport_guard.js also only runs on iPhone and iPad). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Lingkaran: a verified UNDIP alumni network.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lingkaran">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Start the two big downloads at once instead of after the loader. -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

  <style>
    html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: #F7F7F8; }
    /* Start screen shown until Flutter draws (removed by splash.js). */
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #F7F7F8; color: #141414;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      transition: opacity .2s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash b { font-size: 28px; font-weight: 800; letter-spacing: -.01em; }
    #splash small { margin-top: 4px; font-size: 13px; color: #5F6368; }
    #splash i {
      margin-top: 28px; width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid #DCDDE0; border-top-color: #141414;
      animation: splash-spin .8s linear infinite;
    }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #splash i { animation: none; } }
  </style>

  <title>Lingkaran</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="splash" role="status" aria-label="Lingkaran">
    <b>Lingkaran</b>
    <small>by Ikafe Undip</small>
    <i></i>
  </div>
  <script src="viewport_guard.js"></script>
  <script src="splash.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
