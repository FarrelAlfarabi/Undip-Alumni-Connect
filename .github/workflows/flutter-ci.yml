name: Flutter CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned. pubspec.lock needs Dart >= 3.13.3 and Flutter >= 3.44.0.
  FLUTTER_VERSION: "3.47.4"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # .env is gitignored but declared as an asset in pubspec.yaml,
      # so the build fails without it. Use the placeholder values.
      - name: Create placeholder .env
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # Debug APK for closed beta testers. Runs only after analyze and tests pass.
  build-apk:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Write .env from variables or secrets
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::The APK build needs SUPABASE_URL and SUPABASE_ANON_KEY (publishable key only) as GitHub variables or secrets. Add them under Settings > Secrets and variables > Actions, then re-run this job."
            exit 1
          fi
          # Refuse anything but a publishable key (the key ends up inside the APK).
          bash scripts/check_supabase_env.sh
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env

      # Optional. With the same debug keystore on every build, testers can
      # install each new APK over the old one.
      - name: Restore debug keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "Using the fixed debug keystore from ANDROID_DEBUG_KEYSTORE_BASE64."
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not set. Every build is signed with a new random debug key, so testers must UNINSTALL the old app before installing each new APK."
          fi

      - name: Install dependencies
        run: flutter pub get

      # Fails while the operator name, contact email or address in
      # lib/config/policy_config.dart still say [FILL IN: ...]. Testers accept
      # that policy, so it must name who runs the app.
      - name: Release gate (policy placeholders)
        run: flutter test --dart-define=RELEASE_CHECK=true test/release_check_test.dart

      - name: Build debug APK
        run: flutter build apk --debug --build-number "${{ github.run_number }}"

      - name: Name the APK
        id: name
        run: |
          VERSION="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/')"
          NAME="lingkaran-${VERSION}+${{ github.run_number }}-debug"
          cp build/app/outputs/flutter-apk/app-debug.apk "${NAME}.apk"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ steps.name.outputs.name }}.apk
          retention-days: 7
          if-no-files-found: error
