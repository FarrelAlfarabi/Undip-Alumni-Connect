name: supabase-deploy

# Applies new files in supabase/migrations when they reach main. Merging the PR
# is the approval. Two projects, two jobs (a failure in one does not stop the other):
#  - deploy      : the OLD project (secret SUPABASE_DB_URL, Session pooler string)
#  - deploy-new  : the NEW project lingkaran-demo-dummy (secret SUPABASE_DB_URL_NEW,
#                  Session pooler string). The site on the main link uses this one.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/deploy/**'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Check the secret is set
        run: test -n "$SUPABASE_DB_URL" || { echo "Add the SUPABASE_DB_URL secret first."; exit 1; }

      - name: Fix migration history (one time, safe to repeat)
        run: bash supabase/deploy/repair_history.sh

      - name: Show what will be applied
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Apply new migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes

  deploy-new:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL_NEW }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Check the secret is set
        run: test -n "$SUPABASE_DB_URL" || { echo "Add the SUPABASE_DB_URL_NEW secret first."; exit 1; }

      - name: Align migration history (one time, safe to repeat)
        run: bash supabase/deploy/repair_history_new.sh

      - name: Show what will be applied
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Apply new migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
